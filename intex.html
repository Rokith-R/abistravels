<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon | ABIS Travels</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    width: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #061321;
}

.hero {
    width: 100%;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            rgba(3, 13, 27, 0.15),
            rgba(3, 13, 27, 0.55),
            rgba(3, 13, 27, 0.95)
        ),
        radial-gradient(circle at 50% 35%, #286c91, #102a43 45%, #030914 100%);
}

/* Stars */
.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(#8fdcff 1px, transparent 1px);
    background-size: 70px 70px, 110px 110px;
    background-position: 0 0, 30px 20px;
    opacity: 0.35;
}

/* Moon */
.moon {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #d8f1ff;
    box-shadow: 0 0 50px #8bd9ff;
    top: 15%;
    right: 15%;
    opacity: 0.8;
}

/* Mountains */
.mountain {
    position: absolute;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: 50vw solid transparent;
    border-right: 50vw solid transparent;
    border-bottom: 65vh solid #081522;
}

.mountain.back {
    border-bottom-color: #18334b;
    bottom: 10%;
    transform: scale(1.2);
    opacity: 0.6;
}

/* Main content */
.content {
    z-index: 5;
    position: relative;
    padding: 20px;
    width: 100%;
    max-width: 700px;
}

.logo {
    color: white;
    font-size: 18px;
    letter-spacing: 8px;
    font-weight: bold;
    margin-bottom: 35px;
}

.line {
    width: 60px;
    height: 3px;
    background: #52d5ff;
    margin: 20px auto;
    box-shadow: 0 0 15px #52d5ff;
}

h1 {
    color: white;
    font-size: clamp(45px, 9vw, 90px);
    letter-spacing: 8px;
    font-weight: 900;
    text-shadow: 0 5px 30px rgba(0,0,0,0.6);
}

.subtitle {
    color: #bcecff;
    font-size: 16px;
    letter-spacing: 5px;
    margin-top: 20px;
}

.footer {
    position: absolute;
    bottom: 35px;
    width: 100%;
    color: #91b5c9;
    font-size: 12px;
    letter-spacing: 3px;
    z-index: 5;
}

/* Airplane animation */
.plane {
    position: absolute;
    font-size: 40px;
    top: 30%;
    left: -100px;
    animation: fly 12s linear infinite;
    transform: rotate(-10deg);
}

@keyframes fly {
    0% {
        left: -100px;
    }
    100% {
        left: 110%;
    }
}

/* Mobile */
@media (max-width: 600px) {
    .moon {
        width: 90px;
        height: 90px;
        top: 12%;
        right: 12%;
    }

    h1 {
        letter-spacing: 4px;
    }

    .logo {
        letter-spacing: 5px;
        font-size: 15px;
    }

    .subtitle {
        font-size: 12px;
        letter-spacing: 3px;
    }

    .footer {
        font-size: 10px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="hero">

    <div class="stars"></div>
    <div class="moon"></div>

    <div class="mountain back"></div>
    <div class="mountain"></div>

    <div class="plane">✈</div>

    <div class="content">

        <div class="logo">ABIS TRAVELS</div>

        <div class="line"></div>

        <h1>COMING<br>SOON</h1>

        <p class="subtitle">
            YOUR JOURNEY STARTS HERE
        </p>

        <div class="line"></div>

    </div>

    <div class="footer">
        SOMETHING AMAZING IS ON THE WAY
    </div>

</div>

</body>
</html>
