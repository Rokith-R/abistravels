<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | ABIS Travels</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #132538 0%, #09111a 60%, #05090e 100%);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 20% 25%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 75% 18%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 15% 65%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 50% 12%, rgba(255,255,255,0.5), transparent);
      pointer-events: none;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      text-align: center;
      z-index: 1;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.6rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: 5px;
      color: #f8fafc;
      text-shadow: 0 4px 20px rgba(0, 195, 255, 0.25);
      margin-bottom: 12px;
    }

    .tagline-pill {
      display: inline-flex;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 6px;
      overflow: hidden;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 45px;
    }

    .tagline-pill span:first-child {
      background: #ffffff;
      color: #09111a;
      padding: 6px 14px;
    }

    .tagline-pill span:last-child {
      background: rgba(9, 17, 26, 0.85);
      color: #ffffff;
      padding: 6px 16px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      align-items: center;
      gap: 35px;
      margin-bottom: 45px;
    }

    .hero-text {
      text-align: left;
    }

    .coming-soon {
      font-size: clamp(3rem, 6.5vw, 5.2rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 18px;
    }

    .sub-journey {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #cbd5e1;
      border-left: 3px solid #38bdf8;
      padding-left: 12px;
    }

    .bus-showcase {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 25px rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .bus-showcase img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      filter: brightness(0.95) contrast(1.06);
    }

    .bus-showcase::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(9, 17, 26, 0.4) 0%, transparent 35%, rgba(9, 17, 26, 0.25) 100%);
      pointer-events: none;
    }

    .disclaimer {
      font-size: 0.85rem;
      color: #e2e8f0;
      max-width: 820px;
      margin: 0 auto 12px;
      line-height: 1.5;
    }

    .footer-note {
      font-size: 0.75rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .copyright {
      font-size: 0.78rem;
      color: #64748b;
      letter-spacing: 1px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      max-width: 520px;
      margin: 0 auto;
    }

    @media (max-width: 820px) {
      .hero-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero-text {
        text-align: center;
      }

      .sub-journey {
        border-left: none;
        padding-left: 0;
      }

      .bus-showcase img {
        height: 240px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="brand-title">ABIS TRAVELS</h1>

    <div class="tagline-pill">
      <span>BUS TRAVELS</span>
      <span>BOOK YOUR BUS JOURNEYS</span>
    </div>

    <div class="hero-grid">
      <div class="hero-text">
        <div class="coming-soon">COMING<br>SOON</div>
        <p class="sub-journey">Your Journey Starts Here</p>
      </div>

      <div class="bus-showcase">
        <img src="bus.jpg.jpeg" alt="ABIS Travels Luxury Bus">
      </div>
    </div>

    <p class="disclaimer">
      *Disclaimer: We are an independent booking and travel services facilitator. Please check terms before booking.
    </p>
    <p class="footer-note">Something Amazing Is On The Way</p>
    <p class="copyright">&copy; 2026 ABIS Travels. All Rights Reserved.</p>
  </div>

</body>
</html>
